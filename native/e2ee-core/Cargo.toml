[package]
name = "binary-chat-e2ee-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "Isolated OpenMLS compatibility spike for Binary Chat; not production cryptography."

# The crate is intentionally a test harness only. The production library has
# no runtime crypto API until the native storage and FFI boundaries are reviewed.
[dev-dependencies]
openmls = { version = "=0.9.2", features = ["openmls_rust_crypto"] }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
